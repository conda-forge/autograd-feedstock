{% set version = "1.9.0" %}
{% set sha256 = "5352ea2940cc7cf8ffa97a53171ec1cc538b4d32bb9c9fbfda40940cef0e79a9" %}

package:
  name: autograd
  version: {{ version }}

source:
  fn: autograd-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/a/autograd/autograd-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling
    - numpy >=1.25
    - scipy >=1.11
  run:
    - python >={{ python_min }}
    - numpy >=1.25,<3
    - scipy >=1.11

test:
  requires:
    - python {{ python_min }}
  imports:
    - autograd
    - autograd.numpy
    - autograd.scipy
    - autograd.scipy.stats

about:
  home: https://github.com/HIPS/autograd
  license: MIT
  license_family: MIT
  license_file: license.txt
  summary: Efficiently computes derivatives of NumPy code.

extra:
  recipe-maintainers:
    - fjosw
    - agriyakhetarpal
    - richardotis
    - ericmjl
    - benvial
